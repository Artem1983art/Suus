<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сучасний прогноз погоди</title>
    <!-- Підключаємо сучасний шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .weather-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .location {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #94a3b8;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .temp-box {
            margin: 15px 0;
        }

        .temp {
            font-size: 68px;
            font-weight: 700;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .condition {
            font-size: 18px;
            font-weight: 600;
            margin-top: 5px;
            color: #e2e8f0;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 20px 0;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px;
            border-radius: 14px;
            text-align: center;
        }

        .detail-title {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 15px;
            font-weight: 600;
            color: #f1f5f9;
        }

        /* Стилі для прогнозу на тиждень */
        .forecast-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 20px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .forecast-title {
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .forecast-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .forecast-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 14px;
        }

        .forecast-day {
            font-weight: 500;
            color: #e2e8f0;
            width: 90px;
            text-align: left;
        }

        .forecast-icon {
            font-size: 16px;
        }

        .forecast-temps {
            font-weight: 600;
            color: #f8fafc;
            display: flex;
            gap: 10px;
        }

        .temp-max {
            color: #f8fafc;
        }

        .temp-min {
            color: #94a3b8;
        }

        .footer-note {
            text-align: center;
            margin-top: 5px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="weather-container">
        <!-- Головна картка погоди -->
        <div class="weather-card">
            <div class="location" id="location">
                <span>📍</span> Визначаємо локацію...
            </div>
            
            <div class="temp-box">
                <div class="temp" id="temp">--°</div>
                <div class="condition" id="condition">Завантаження...</div>
            </div>

            <div class="divider"></div>

            <div class="details-grid">
                <div class="detail-item">
                    <div class="detail-title">Вологість</div>
                    <div class="detail-value" id="humidity">--%</div>
                </div>
                <div class="detail-item">
                    <div class="detail-title">Вітер</div>
                    <div class="detail-value" id="wind">-- км/год</div>
                </div>
            </div>
        </div>

        <!-- Картка прогнозу на тиждень -->
        <div class="forecast-card">
            <div class="forecast-title">Прогноз на 7 днів</div>
            <div class="forecast-list" id="forecast-list">
                <div style="text-align: center; color: #94a3b8; font-size: 13px; padding: 10px;">Завантаження прогнозу...</div>
            </div>
        </div>

        <div class="footer-note">Дані: Open-Meteo</div>
    </div>

    <script>
        function getWeatherDescription(code) {
            const weatherCodes = {
                0: "Ясно ☀️",
                1: "Переважно ясно 🌤",
                2: "Мінлива хмарність ⛅",
                3: "Похмуро ☁️",
                45: "Туман 🌫",
                51: "Мряка 🌧",
                61: "Дощ 🌧",
                71: "Сніг ❄️",
                95: "Гроза ⚡"
            };
            return weatherCodes[code] || "Хмарно / Опади";
        }

        function getWeatherIcon(code) {
            const icons = {
                0: "☀️",
                1: "🌤",
                2: "⛅",
                3: "☁️",
                45: "🌫",
                51: "🌧",
                61: "🌧",
                71: "❄️",
                95: "⚡"
            };
            return icons[code] || "🌡";
        }

        function formatDay(dateString) {
            const date = new Date(dateString);
            const today = new Date();
            if (date.toDateString() === today.toDateString()) {
                return "Сьогодні";
            }
            return date.toLocaleDateString('uk-UA', { weekday: 'short', month: 'numeric', day: 'numeric' });
        }

        function getWeatherData(lat, lon, cityName = "Ваші координати") {
            document.getElementById('location').innerHTML = `<span>📍</span> ${cityName}`;
            
            // Запит на поточну погоду та щоденний прогноз на 7 днів
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    // Поточна погода
                    const current = data.current;
                    document.getElementById('temp').innerText = Math.round(current.temperature_2m) + '°';
                    document.getElementById('condition').innerText = getWeatherDescription(current.weather_code);
                    document.getElementById('humidity').innerText = current.relative_humidity_2m + '%';
                    document.getElementById('wind').innerText = current.wind_speed_10m + ' км/год';

                    // Прогноз на тиждень
                    const daily = data.daily;
                    let forecastHTML = '';
                    
                    for (let i = 0; i < daily.time.length; i++) {
                        const dayName = formatDay(daily.time[i]);
                        const icon = getWeatherIcon(daily.weather_code[i]);
                        const maxTemp = Math.round(daily.temperature_2m_max[i]);
                        const minTemp = Math.round(daily.temperature_2m_min[i]);

                        forecastHTML += `
                            <div class="forecast-item">
                                <span class="forecast-day">${dayName}</span>
                                <span class="forecast-icon">${icon}</span>
                                <div class="forecast-temps">
                                    <span class="temp-max">${maxTemp}°</span>
                                    <span class="temp-min">${minTemp}°</span>
                                </div>
                            </div>
                        `;
                    }
                    document.getElementById('forecast-list').innerHTML = forecastHTML;
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('condition').innerText = "Помилка завантаження";
                    document.getElementById('forecast-list').innerHTML = `<div style="text-align: center; color: #ef4444; font-size: 13px;">Не вдалося завантажити прогноз</div>`;
                });
        }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                position => {
                    getWeatherData(position.coords.latitude, position.coords.longitude);
                },
                error => {
                    getWeatherData(47.91, 33.39, "Кривий Ріг");
                }
            );
        } else {
            getWeatherData(47.91, 33.39, "Кривий Ріг");
        }
    </script>

</body>
</html>
