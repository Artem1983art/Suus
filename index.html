<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода за IP</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            color: #1a73e8;
        }
        .country {
            font-size: 14px;
            color: #777;
            margin-bottom: 15px;
        }
        .current-temp {
            font-size: 52px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
        }
        .details {
            font-size: 15px;
            color: #555;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
        }
        .forecast-title {
            font-size: 18px;
            font-weight: 500;
            margin-top: 15px;
            margin-bottom: 10px;
            border-top: 1px solid #eee;
            padding-top: 15px;
            text-align: left;
        }
        .forecast-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .forecast-item {
            display: flex;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        .footer {
            margin-top: 20px;
            font-size: 13px;
        }
        .footer a {
            color: #1a73e8;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="city">Визначаємо місто...</h1>
        <div class="country" id="country"></div>
        
        <div class="current-temp" id="temp">--°C</div>
        
        <div class="details">
            <span id="wind">Вітер: -- км/год</span>
            <span id="humidity">Вологість: --%</span>
        </div>

        <div class="forecast-title">Прогноз на 7 днів</div>
        <div class="forecast-list" id="forecast">
            <div class="forecast-item">Завантаження прогнозу...</div>
        </div>

        <div class="footer">
            <a href="Policy.html">Політика конфіденційності</a>
        </div>
    </div>

    <script>
        async function getWeatherData() {
            try {
                // 1. Автоматично визначаємо місто та координати за IP
                const ipResponse = await fetch('https://ipapi.co/json/');
                const ipData = await ipResponse.json();
                
                const city = ipData.city || "Невідомо";
                const country = ipData.country_name || "";
                const lat = ipData.latitude;
                const lon = ipData.longitude;

                if (!lat || !lon) {
                    throw new Error("Не вдалося знайти координати за IP");
                }

                document.getElementById('city').innerText = city;
                document.getElementById('country').innerText = country;

                // 2. Отримуємо погоду (текучу та на 7 днів) з Open-Meteo
                const weatherResponse = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto`);
                const weatherData = await weatherResponse.json();

                // Поточні дані
                const current = weatherData.current;
                document.getElementById('temp').innerText = `${Math.round(current.temperature_2m)}°C`;
                document.getElementById('wind').innerText = `Вітер: ${current.wind_speed_10m} км/год`;
                document.getElementById('humidity').innerText = `Вологість: ${current.relative_humidity_2m}%`;

                // Прогноз на 7 днів
                const daily = weatherData.daily;
                let forecastHTML = '';
                
                for (let i = 0; i < 7; i++) {
                    const date = new Date(daily.time[i]);
                    const dayName = date.toLocaleDateString('uk-UA', { weekday: 'short', month: 'numeric', day: 'numeric' });
                    const maxT = Math.round(daily.temperature_2m_max[i]);
                    const minT = Math.round(daily.temperature_2m_min[i]);

                    forecastHTML += `
                        <div class="forecast-item">
                            <span>${dayName}</span>
                            <span><b>${maxT}°C</b> / ${minT}°C</span>
                        </div>
                    `;
                }

                document.getElementById('forecast').innerHTML = forecastHTML;

            } catch (error) {
                console.error(error);
                document.getElementById('city').innerText = "Помилка";
                document.getElementById('country').innerText = "";
                document.getElementById('temp').innerText = "--°C";
                document.getElementById('wind').innerText = "Не вдалося завантажити дані";
                document.getElementById('humidity').innerText = "";
            }
        }

        getWeatherData();
    </script>
</body>
</html>
