<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода за IP</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            color: #1a73e8;
        }
        .country {
            font-size: 14px;
            color: #777;
            margin-bottom: 15px;
        }
        .current-temp {
            font-size: 52px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
        }
        .details {
            font-size: 15px;
            color: #555;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
        }
        .forecast-title {
            font-size: 18px;
            font-weight: 500;
            margin-top: 15px;
            margin-bottom: 10px;
            border-top: 1px solid #eee;
            padding-top: 15px;
            text-align: left;
        }
        .forecast-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .forecast-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            text-align: left;
        }
        .forecast-item.today {
            background: #e8f0fe;
            border: 1px solid #d2e3fc;
        }
        .forecast-day {
            font-weight: 500;
            width: 90px;
        }
        .forecast-desc {
            color: #666;
            flex-grow: 1;
            padding: 0 10px;
            font-size: 13px;
        }
        .forecast-temp {
            font-weight: bold;
            white-space: nowrap;
        }
        .footer {
            margin-top: 20px;
            font-size: 13px;
        }
        .footer a {
            color: #1a73e8;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="city">Визначаємо місто...</h1>
        <div class="country" id="country"></div>
        
        <div class="current-temp" id="temp">--°C</div>
        
        <div class="details">
            <span id="wind">Вітер: -- км/год</span>
            <span id="humidity">Вологість: --%</span>
        </div>

        <div class="forecast-title">Прогноз на тиждень</div>
        <div class="forecast-list" id="forecast">
            <div class="forecast-item">Завантаження прогнозу...</div>
        </div>

        <div class="footer">
            <a href="policy.html">Політика конфіденційності</a>
        </div>
    </div>

    <script>
        function getWeatherDescription(code) {
            const weatherCodes = {
                0: "Ясно",
                1: "Переважно ясно",
                2: "Мінлива хмарність",
                3: "Похмуро",
                45: "Туман",
                48: "Іній",
                51: "Невеликий дощ",
                53: "Помірний дощ",
                55: "Сильний дощ",
                61: "Невеликий дощ",
                63: "Дощ",
                65: "Злива",
                71: "Невеликий сніг",
                73: "Сніг",
                75: "Сильний сніг",
                95: "Гроза"
            };
            return weatherCodes[code] ? weatherCodes[code] : "Хмарно";
        }

        async function getWeatherData() {
            try {
                const ipResponse = await fetch('https://ipapi.co/json/');
                const ipData = await ipResponse.json();
                
                const city = ipData.city || "Невідомо";
                const country = ipData.country_name || "";
                const lat = ipData.latitude;
                const lon = ipData.longitude;

                if (!lat || !lon) {
                    throw new Error("Не вдалося знайти координати за IP");
                }

                document.getElementById('city').innerText = city;
                document.getElementById('country').innerText = country;

                const weatherResponse = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`);
                const weatherData = await weatherResponse.json();

                const current = weatherData.current;
                document.getElementById('temp').innerText = `${Math.round(current.temperature_2m)}°C`;
                document.getElementById('wind').innerText = `Вітер: ${current.wind_speed_10m} км/год`;
                document.getElementById('humidity').innerText = `Вологість: ${current.relative_humidity_2m}%`;

                const daily = weatherData.daily;
                let forecastHTML = '';
                
                for (let i = 0; i < daily.time.length; i++) {
                    const date = new Date(daily.time[i]);
                    const isToday = i === 0;
                    
                    let dayName = date.toLocaleDateString('uk-UA', { weekday: 'short', month: 'numeric', day: 'numeric' });
                    if (isToday) {
                        dayName = "Сьогодні";
                    }

                    const maxT = Math.round(daily.temperature_2m_max[i]);
                    const minT = Math.round(daily.temperature_2m_min[i]);
                    const weatherDesc = getWeatherDescription(daily.weather_code[i]);

                    forecastHTML += `
                        <div class="forecast-item ${isToday ? 'today' : ''}">
                            <span class="forecast-day">${dayName}</span>
                            <span class="forecast-desc">${weatherDesc}</span>
                            <span class="forecast-temp"><b>${maxT}°C</b> / ${minT}°C</span>
                        </div>
                    `;
                }

                document.getElementById('forecast').innerHTML = forecastHTML;

            } catch (error) {
                console.error(error);
                document.getElementById('city').innerText = "Помилка";
                document.getElementById('country').innerText = "";
                document.getElementById('temp').innerText = "--°C";
                document.getElementById('wind').innerText = "Не вдалося завантажити дані";
                document.getElementById('humidity').innerText = "";
            }
        }

        getWeatherData();
    </script>
</body>
</html>
