<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода (Google Style)</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f4f9;
            color: #1f1f1f;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .weather-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .main-card {
            background: linear-gradient(135deg, #1a73e8, #4285f4);
            color: #ffffff;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 4px 12px rgba(60, 64, 67, 0.15);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .location {
            font-size: 22px;
            font-weight: 500;
        }
        .current-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .temp-area {
            display: flex;
            align-items: flex-start;
        }
        .temp {
            font-size: 76px;
            font-weight: 700;
            line-height: 1;
        }
        .temp-unit {
            font-size: 32px;
            margin-top: 6px;
        }
        .condition-icon {
            font-size: 64px;
        }
        .condition-text {
            font-size: 18px;
            font-weight: 500;
        }
        .details-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(60, 64, 67, 0.08);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .detail-label {
            font-size: 13px;
            color: #5f6368;
        }
        .detail-val {
            font-size: 16px;
            font-weight: 500;
            color: #202124;
        }
        .forecast-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(60, 64, 67, 0.08);
        }
        .forecast-title {
            font-size: 15px;
            font-weight: 500;
            color: #5f6368;
            margin-bottom: 15px;
        }
        .forecast-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .forecast-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }
        .forecast-day {
            width: 100px;
            color: #202124;
            font-weight: 500;
        }
        .forecast-icon {
            font-size: 20px;
        }
        .forecast-temps {
            display: flex;
            gap: 15px;
            font-weight: 500;
        }
        .max-t {
            color: #202124;
        }
        .min-t {
            color: #5f6368;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #80868b;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="weather-container">
        <div class="main-card">
            <div class="location" id="location">Визначаємо локацію...</div>
            <div class="current-main">
                <div class="temp-area">
                    <div class="temp" id="temp">--</div>
                    <div class="temp-unit">°C</div>
                </div>
                <div class="condition-icon" id="main-icon">🌡️</div>
            </div>
            <div class="condition-text" id="condition">Завантаження даних...</div>
        </div>

        <div class="details-card">
            <div class="detail-item">
                <span class="detail-label">Вологість</span>
                <span class="detail-val" id="humidity">--%</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Швидкість вітру</span>
                <span class="detail-val" id="wind">-- км/год</span>
            </div>
        </div>

        <div class="forecast-card">
            <div class="forecast-title">Прогноз на 7 днів</div>
            <div class="forecast-list" id="forecast-list">
                <div style="color: #5f6368; font-size: 14px; text-align: center; padding: 10px;">Завантаження прогнозу...</div>
            </div>
        </div>

        <div class="footer">Дані погоди від Open-Meteo</div>
    </div>

    <script>
        function getWeatherDescription(code) {
            const weatherCodes = {
                0: "Ясно",
                1: "Переважно ясно",
                2: "Мінлива хмарність",
                3: "Похмуро",
                45: "Туман",
                51: "Мряка",
                61: "Дощ",
                71: "Сніг",
                95: "Гроза"
            };
            return weatherCodes[code] || "Хмарно";
        }

        function getWeatherIcon(code) {
            const icons = {
                0: "☀️",
                1: "🌤️",
                2: "⛅",
                3: "☁️",
                45: "🌫️",
                51: "🌧️",
                61: "🌧️",
                71: "❄️",
                95: "⚡"
            };
            return icons[code] || "🌤️";
        }

        function formatDay(dateString) {
            const date = new Date(dateString);
            const today = new Date();
            if (date.toDateString() === today.toDateString()) {
                return "Сьогодні";
            }
            return date.toLocaleDateString('uk-UA', { weekday: 'long', month: 'numeric', day: 'numeric' });
        }

        function getCityName(lat, lon) {
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=uk`)
                .then(res => res.json())
                .then(data => {
                    const address = data.address;
                    const city = address.city || address.town || address.village || address.municipality || "Ваша локація";
                    const country = address.country || "";
                    document.getElementById('location').innerText = `${city}, ${country}`;
                })
                .catch(() => {
                    document.getElementById('location').innerText = "Ваші координати";
                });
        }

        function getWeatherData(lat, lon) {
            getCityName(lat, lon);
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const current = data.current;
                    document.getElementById('temp').innerText = Math.round(current.temperature_2m);
                    document.getElementById('condition').innerText = getWeatherDescription(current.weather_code);
                    document.getElementById('main-icon').innerText = getWeatherIcon(current.weather_code);
                    document.getElementById('humidity').innerText = current.relative_humidity_2m + '%';
                    document.getElementById('wind').innerText = current.wind_speed_10m + ' км/год';

                    const daily = data.daily;
                    let forecastHTML = '';
                    
                    for (let i = 0; i < daily.time.length; i++) {
                        const dayName = formatDay(daily.time[i]);
                        const icon = getWeatherIcon(daily.weather_code[i]);
                        const maxTemp = Math.round(daily.temperature_2m_max[i]);
                        const minTemp = Math.round(daily.temperature_2m_min[i]);

                        forecastHTML += `
                            <div class="forecast-item">
                                <span class="forecast-day">${dayName}</span>
                                <span class="forecast-icon">${icon}</span>
                                <div class="forecast-temps">
                                    <span class="max-t">${maxTemp}°</span>
                                    <span class="min-t">${minTemp}°</span>
                                </div>
                            </div>
                        `;
                    }
                    document.getElementById('forecast-list').innerHTML = forecastHTML;
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('condition').innerText = "Помилка завантаження даних";
                });
        }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                position => {
                    getWeatherData(position.coords.latitude, position.coords.longitude);
                },
                error => {
                    getWeatherData(47.91, 33.39);
                }
            );
        } else {
            getWeatherData(47.91, 33.39);
        }
    </script>
</body>
</html>
