<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода у будь-якому куточку світу</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .search-box {
            display: flex;
            margin-bottom: 20px;
            gap: 8px;
        }
        .search-box input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .search-box button {
            padding: 8px 15px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .search-box button:hover {
            background: #1557b0;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #1a73e8;
        }
        .current-temp {
            font-size: 48px;
            font-weight: bold;
            margin: 15px 0;
            color: #333;
        }
        .details {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }
        .forecast-title {
            font-size: 18px;
            font-weight: 500;
            margin-top: 20px;
            margin-bottom: 10px;
            border-top: 1px solid #eee;
            padding-top: 15px;
            text-align: left;
        }
        .forecast-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .forecast-item {
            display: flex;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Пошук будь-якого міста чи села світу -->
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Введіть місто чи село...">
            <button onclick="searchByCity()">Шукати</button>
        </div>

        <h1 id="city">Визначаємо локацію...</h1>
        <div class="current-temp" id="temp">--°C</div>
        <div class="details" id="condition">Завантаження даних...</div>

        <div class="forecast-title">Прогноз на 7 днів</div>
        <div class="forecast-list" id="forecast">
            <div class="forecast-item">Завантаження прогнозу...</div>
        </div>
    </div>

    <script>
        // Функція для завантаження погоди за широтою та довготою
        async function fetchWeather(lat, lon, locationName) {
            try {
                const weatherResponse = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&timezone=auto`);
                const weatherData = await weatherResponse.json();

                const currentTemp = Math.round(weatherData.current_weather.temperature);
                document.getElementById('temp').innerText = `${currentTemp}°C`;
                document.getElementById('condition').innerText = `Вітер: ${weatherData.current_weather.windspeed} км/год`;
                document.getElementById('city').innerText = locationName;

                const daily = weatherData.daily;
                let forecastHTML = '';
                
                for (let i = 0; i < 7; i++) {
                    const date = new Date(daily.time[i]);
                    const dayName = date.toLocaleDateString('uk-UA', { weekday: 'short', month: 'numeric', day: 'numeric' });
                    const maxT = Math.round(daily.temperature_2m_max[i]);
                    const minT = Math.round(daily.temperature_2m_min[i]);

                    forecastHTML += `
                        <div class="forecast-item">
                            <span>${dayName}</span>
                            <span><b>${maxT}°C</b> / ${minT}°C</span>
                        </div>
                    `;
                }

                document.getElementById('forecast').innerHTML = forecastHTML;
            } catch (error) {
                console.error(error);
                document.getElementById('condition').innerText = "Помилка завантаження погоди.";
            }
        }

        // Автоматичне визначення за IP при заході на сайт
        async function getIPLocation() {
            try {
                const ipResponse = await fetch('https://ipapi.co/json/');
                const ipData = await ipResponse.json();
                
                const city = ipData.city || "Невідомо";
                const country = ipData.country_name || "";
                
                if (ipData.latitude && ipData.longitude) {
                    fetchWeather(ipData.latitude, ipData.longitude, `${city}, ${country}`);
                } else {
                    throw new Error("Немає координат");
                }
            } catch (error) {
                // Запасний варіант (наприклад, Київ), якщо IP не визначився
                fetchWeather(50.4501, 30.5234, "Київ, Україна");
            }
        }

        // Ручний пошук через геокодер Open-Meteo (працює для будь-яких сіл і міст світу)
        async function searchByCity() {
            const query = document.getElementById('cityInput').value.trim();
            if (!query) return;

            document.getElementById('city').innerText = "Шукаємо...";
            try {
                const geoResponse = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=uk&format=json`);
                const geoData = await geoResponse.json();

                if (geoData.results && geoData.results.length > 0) {
                    const loc = geoData.results[0];
                    const name = `${loc.name}, ${loc.country || ''}`;
                    fetchWeather(loc.latitude, loc.longitude, name);
                } else {
                    document.getElementById('city').innerText = "Нічого не знайдено";
                    document.getElementById('temp').innerText = "--°C";
                    document.getElementById('condition').innerText = "Спробуйте іншу назву";
                }
            } catch (error) {
                document.getElementById('city').innerText = "Помилка пошуку";
            }
        }

        getIPLocation();
    </script>
</body>
</html>
