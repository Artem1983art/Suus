<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Точна погода за геолокацією</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 440px;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            color: #1a73e8;
        }
        .country {
            font-size: 14px;
            color: #777;
            margin-bottom: 15px;
        }
        .current-temp {
            font-size: 52px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
        }
        .details {
            font-size: 15px;
            color: #555;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
        }
        .forecast-title {
            font-size: 18px;
            font-weight: 500;
            margin-top: 15px;
            margin-bottom: 10px;
            border-top: 1px solid #eee;
            padding-top: 15px;
            text-align: left;
        }
        .forecast-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .forecast-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            text-align: left;
        }
        .forecast-item.today {
            background: #e8f0fe;
            border: 1px solid #d2e3fc;
        }
        .forecast-day {
            font-weight: 500;
            width: 80px;
        }
        .forecast-desc {
            color: #555;
            flex-grow: 1;
            padding: 0 8px;
        }
        .forecast-temp {
            font-weight: bold;
            white-space: nowrap;
        }
        .footer {
            margin-top: 20px;
            font-size: 13px;
        }
        .footer a {
            color: #1a73e8;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="city">Визначення локації...</h1>
        <div class="country" id="country">Будь ласка, дозвольте доступ до геопозиції</div>
        
        <div class="current-temp" id="temp">--°C</div>
        
        <div class="details">
            <span id="wind">Вітер: -- км/год</span>
            <span id="humidity">Вологість: --%</span>
        </div>

        <div class="forecast-title">Прогноз із часовими інтервалами</div>
        <div class="forecast-list" id="forecast">
            <div class="forecast-item">Очікування доступу до геолокації...</div>
        </div>

        <div class="footer">
            <a href="policy.html">Політика конфіденційності</a>
        </div>
    </div>

    <script>
        function getWeatherDescription(code) {
            const weatherCodes = {
                0: "Ясно",
                1: "Переважно ясно",
                2: "Мінлива хмарність",
                3: "Похмуро",
                45: "Туман",
                48: "Іній",
                51: "Невеликий дощ",
                53: "Помірний дощ",
                55: "Сильний дощ",
                61: "Дощ з",
                63: "Дощ",
                65: "Злива",
                71: "Невеликий сніг",
                73: "Сніг",
                75: "Сильний сніг",
                95: "Гроза"
            };
            return weatherCodes[code] ? weatherCodes[code] : "Змішано";
        }

        // Аналізуємо погодинні дані, щоб знайти точний час опадів (наприклад, "Дощ з 14:00 по 18:00")
        function getHourlyRainTime(hourlyData, targetDayIndex) {
            const times = hourlyData.time;
            const codes = hourlyData.weather_code;
            
            let rainStart = null;
            let rainEnd = null;

            for (let i = 0; i < times.length; i++) {
                const dateObj = new Date(times[i]);
                const dayIndex = Math.floor(i / 24);

                if (dayIndex === targetDayIndex) {
                    const isRain = codes[i] >= 51 && codes[i] <= 65;
                    const hourStr = dateObj.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });

                    if (isRain) {
                        if (rainStart === null) rainStart = hourStr;
                        rainEnd = hourStr;
                    }
                }
            }

            if (rainStart !== null) {
                return `Дощ із ${rainStart} по ${rainEnd}`;
            }
            return null;
        }

        async function initGeolocationWeather() {
            if (!navigator.geolocation) {
                document.getElementById('city').innerText = "Помилка";
                document.getElementById('country').innerText = "Браузер не підтримує геолокацію";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    try {
                        // Отримуємо назву міста через безкоштовне зворотне геокодування
                        const geoResponse = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=uk`);
                        const geoData = await geoResponse.json();
                        
                        const city = geoData.address.city || geoData.address.town || geoData.address.village || "Ваше місто";
                        const country = geoData.address.country || "";

                        document.getElementById('city').innerText = city;
                        document.getElementById('country').innerText = country;

                        // Запитуємо погодинні та денні дані з Open-Meteo
                        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&hourly=weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
                        const weatherResponse = await fetch(weatherUrl);
                        const weatherData = await weatherResponse.json();

                        // Поточні значення
                        const current = weatherData.current;
                        document.getElementById('temp').innerText = `${Math.round(current.temperature_2m)}°C`;
                        document.getElementById('wind').innerText = `Вітер: ${current.wind_speed_10m} км/год`;
                        document.getElementById('humidity').innerText = `Вологість: ${current.relative_humidity_2m}%`;

                        // Формуємо прогноз із розширеним часом опадів
                        const daily = weatherData.daily;
                        let forecastHTML = '';

                        for (let i = 0; i < daily.time.length; i++) {
                            const date = new Date(daily.time[i]);
                            const isToday = i === 0;
                            const dayName = isToday ? "Сьогодні" : date.toLocaleDateString('uk-UA', { weekday: 'short', month: 'numeric', day: 'numeric' });
                            
                            const maxT = Math.round(daily.temperature_2m_max[i]);
                            const minT = Math.round(daily.temperature_2m_min[i]);

                            // Перевіряємо, чи є дощ у цей день за годинами
                            let desc = getHourlyRainTime(weatherData.hourly, i);
                            if (!desc) {
                                desc = getWeatherDescription(daily.weather_code[i]);
                            }

                            forecastHTML += `
                                <div class="forecast-item ${isToday ? 'today' : ''}">
                                    <span class="forecast-day">${dayName}</span>
                                    <span class="forecast-desc">${desc}</span>
                                    <span class="forecast-temp"><b>${maxT}°C</b> / ${minT}°C</span>
                                </div>
                            `;
                        }

                        document.getElementById('forecast').innerHTML = forecastHTML;

                    } catch (err) {
                        console.error(err);
                        document.getElementById('city').innerText = "Помилка даних";
                        document.getElementById('country').innerText = "Не вдалося завантажити погоду";
                    }
                },
                (error) => {
                    console.warn(error);
                    document.getElementById('city').innerText = "Доступ заборонено";
                    document.getElementById('country').innerText = "Увімкніть геолокацію в браузері";
                    document.getElementById('forecast').innerHTML = `<div class="forecast-item">Будь ласка, дозвольте доступ до геолокації, щоб побачити погоду.</div>`;
                }
            );
        }

        initGeolocationWeather();
    </script>
</body>
</html>
